<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🪂 Emergency Recovery - Two Moons Studio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .parachute {
      font-size: 60px;
      margin-bottom: 10px;
    }
    
    h1 {
      font-size: 28px;
      color: #ffd700;
      margin-bottom: 10px;
    }
    
    .subtitle {
      color: #a0a0a0;
      font-size: 14px;
    }
    
    .container {
      width: 100%;
      max-width: 800px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }
    
    .backup-list {
      margin-bottom: 20px;
    }
    
    .backup-item {
      background: rgba(255, 215, 0, 0.1);
      border: 2px solid rgba(255, 215, 0, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .backup-item:hover {
      background: rgba(255, 215, 0, 0.2);
      border-color: rgba(255, 215, 0, 0.5);
      transform: translateY(-2px);
    }
    
    .backup-item.selected {
      background: rgba(255, 215, 0, 0.25);
      border-color: #ffd700;
    }
    
    .backup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .backup-filename {
      font-size: 18px;
      font-weight: bold;
      color: #ffd700;
    }
    
    .backup-time {
      font-size: 12px;
      color: #a0a0a0;
    }
    
    .backup-size {
      font-size: 12px;
      color: #a0a0a0;
      margin-top: 5px;
    }
    
    .preview-area {
      margin-top: 20px;
      display: none;
    }
    
    .preview-area.visible {
      display: block;
    }
    
    textarea {
      width: 100%;
      min-height: 300px;
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(255, 215, 0, 0.3);
      border-radius: 8px;
      padding: 15px;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      resize: vertical;
      margin-bottom: 15px;
    }
    
    .button-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    button {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .copy-btn {
      background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
      color: #1a1a2e;
    }
    
    .copy-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
    }
    
    .copy-btn.copied {
      background: linear-gradient(135deg, #4CAF50 0%, #66BB6A 100%);
      color: white;
    }
    
    .download-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #e0e0e0;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }
    
    .download-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    
    .instructions {
      background: rgba(0, 150, 255, 0.1);
      border-left: 4px solid rgba(0, 150, 255, 0.5);
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
    }
    
    .instructions h3 {
      color: #4da6ff;
      margin-bottom: 10px;
      font-size: 16px;
    }
    
    .instructions ol {
      padding-left: 20px;
    }
    
    .instructions li {
      margin-bottom: 8px;
    }
    
    .no-backups {
      text-align: center;
      padding: 40px;
      color: #a0a0a0;
    }
    
    .no-backups-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="parachute">🪂</div>
    <h1>Emergency Recovery</h1>
    <div class="subtitle">Restore your last working code</div>
  </div>
  
  <div class="container">
    <div class="backup-list" id="backupList"></div>
    
    <div class="preview-area" id="previewArea">
      <textarea id="backupContent" readonly></textarea>
      
      <div class="button-row">
        <button class="copy-btn" id="copyBtn">📋 Copy to Clipboard</button>
        <button class="download-btn" id="downloadBtn">⬇️ Download File</button>
      </div>
      
      <div class="instructions">
        <h3>📝 How to Restore:</h3>
        <ol>
          <li><strong>Copy the code above</strong> (click Copy button)</li>
          <li><strong>Open Textastic</strong> on your iPad</li>
          <li><strong>Open the file</strong> (shown in backup name)</li>
          <li><strong>Select all text</strong> → Delete → Paste</li>
          <li><strong>Save</strong> the file</li>
          <li><strong>Refresh</strong> your browser preview</li>
          <li><strong>Fixed!</strong> 🎉</li>
        </ol>
      </div>
    </div>
  </div>
  
  <script>
    // Load and display backups
    function loadBackups() {
      const backupList = document.getElementById('backupList');
      const backups = [];
      
      // Check localStorage for backups
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('TAILOR_BACKUP_')) {
          try {
            const data = JSON.parse(localStorage.getItem(key));
            backups.push({
              key: key,
              filename: key.replace('TAILOR_BACKUP_', ''),
              ...data
            });
          } catch (e) {
            console.warn('Could not parse backup:', key);
          }
        }
      }
      
      if (backups.length === 0) {
        backupList.innerHTML = `
          <div class="no-backups">
            <div class="no-backups-icon">📭</div>
            <h3>No Backups Found</h3>
            <p>Backups will appear here after you make changes in Tailor.</p>
          </div>
        `;
        return;
      }
      
      // Sort by timestamp (newest first)
      backups.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
      
      // Display backups
      backupList.innerHTML = backups.map((backup, index) => {
        const date = backup.timestamp ? new Date(backup.timestamp).toLocaleString() : 'Unknown time';
        const size = backup.content ? (backup.content.length / 1024).toFixed(1) + ' KB' : 'Unknown size';
        
        return `
          <div class="backup-item" data-index="${index}">
            <div class="backup-header">
              <div class="backup-filename">📄 ${backup.filename}</div>
              <div class="backup-time">💾 ${date}</div>
            </div>
            <div class="backup-size">Size: ${size}</div>
          </div>
        `;
      }).join('');
      
      // Add click handlers
      document.querySelectorAll('.backup-item').forEach((item, index) => {
        item.addEventListener('click', () => showBackup(backups[index]));
      });
      
      // Auto-select first backup
      if (backups.length > 0) {
        showBackup(backups[0]);
      }
    }
    
    function showBackup(backup) {
      // Update UI
      document.querySelectorAll('.backup-item').forEach(item => {
        item.classList.remove('selected');
      });
      event.currentTarget?.classList.add('selected');
      
      // Show content
      const previewArea = document.getElementById('previewArea');
      const backupContent = document.getElementById('backupContent');
      
      backupContent.value = backup.content || '';
      previewArea.classList.add('visible');
      
      // Store current backup for copy/download
      window.currentBackup = backup;
    }
    
    // Copy to clipboard
    document.getElementById('copyBtn').addEventListener('click', async () => {
      const content = document.getElementById('backupContent').value;
      const btn = document.getElementById('copyBtn');
      
      try {
        await navigator.clipboard.writeText(content);
        btn.textContent = '✅ Copied!';
        btn.classList.add('copied');
        
        setTimeout(() => {
          btn.textContent = '📋 Copy to Clipboard';
          btn.classList.remove('copied');
        }, 2000);
      } catch (err) {
        alert('Copy failed! Please select the text manually and copy it.');
      }
    });
    
    // Download file
    document.getElementById('downloadBtn').addEventListener('click', () => {
      if (!window.currentBackup) return;
      
      const content = window.currentBackup.content;
      const filename = window.currentBackup.filename;
      
      const blob = new Blob([content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    });
    
    // Initialize
    loadBackups();
  </script>
</body>
</html>
